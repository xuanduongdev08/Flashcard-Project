services:
  - type: web
    name: flashcard-app
    env: docker
    plan: free
    region: singapore # hoặc oregon, frankfurt tùy chọn
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: flashcard-db
          property: connectionString

databases:
  - name: flashcard-db
    plan: free
    databaseName: flashcard
    user: flashcard_user
